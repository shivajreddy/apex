[package]
# The crate name `apex` was already taken on crates.io. The binary below is
# still `apex`, so nothing about using it changes.
name = "apex-launcher"
version = "0.2.2"
edition = "2024"
description = "Ultra-fast, ultra-lightweight launcher for Windows. Raycast, but native."
repository = "https://github.com/shivajreddy/apex"
readme = "README.md"
license = "MIT"
keywords = ["launcher", "windows", "spotlight", "productivity", "win32"]
categories = ["gui", "os::windows-apis"]
# The logos are README chrome only; apex.ico is the one asset build.rs needs.
exclude = ["assets/logo.png", "assets/logo-text.png"]

[[bin]]
name = "apex"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
]

# Ultra-lightweight release binary
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
